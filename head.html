<!--
  Critical CSS is inlined below (mirrors styles/styles.css) so the page needs no
  render-blocking stylesheet request before first paint — this shaves ~150ms
  off the critical path (FCP/LCP). styles/styles.css remains the source of
  truth; KEEP THIS BLOCK IN SYNC when editing it. Non-critical rules stay in
  styles/lazy-styles.css and load post-LCP.
-->
<style>
:root {
  --background-color: white;
  --light-color: #f4f4f4;
  --dark-color: #6d6d6d;
  --text-color: #202020;
  --accent-color: #ffea00;
  --accent-hover-color: #e6d200;
  --link-color: #202020;
  --link-hover-color: #000;
  --border-color: #dadada;
  --dark-surface-color: #202020;
  --dark-surface-text: #ebebeb;
  --field-bg-color: rgb(235 235 235 / 54%);
  --field-placeholder-color: #595959;
  --overlay-color: rgb(0 0 0 / 55%);
  --shadow-color: rgb(0 0 0 / 12%);
  --body-font-family: "Source Sans Pro", source-sans-fallback, "Helvetica Neue", helvetica, arial, sans-serif;
  --heading-font-family: asar, asar-fallback, georgia, "Times New Roman", times, serif;
  --body-font-size-m: 18px;
  --body-font-size-s: 16px;
  --body-font-size-xs: 14px;
  --heading-font-size-xxl: 44px;
  --heading-font-size-xl: 36px;
  --heading-font-size-l: 30px;
  --heading-font-size-m: 24px;
  --heading-font-size-s: 20px;
  --heading-font-size-xs: 18px;
  --nav-height: 89px;
  --nav-utility-height: 25px;
  --nav-main-height: 64px;
}
@font-face {
  font-family: asar-fallback;
  src: local('Georgia');
  size-adjust: 103%;
  ascent-override: 95%;
  descent-override: 24%;
  line-gap-override: 0%;
}
@font-face {
  font-family: source-sans-fallback;
  src: local('Arial');
  size-adjust: 105%;
  ascent-override: 91%;
  descent-override: 28%;
  line-gap-override: 0%;
}
@media (width >= 900px) {
  :root {
    --heading-font-size-xxl: 56px;
    --heading-font-size-xl: 44px;
    --heading-font-size-l: 36px;
    --heading-font-size-m: 28px;
    --heading-font-size-s: 22px;
    --heading-font-size-xs: 18px;
  }
}
body {
  display: none;
  margin: 0;
  background-color: var(--background-color);
  color: var(--text-color);
  font-family: var(--body-font-family);
  font-size: var(--body-font-size-m);
  line-height: 1.6;
}
body.appear { display: block; }
header { height: var(--nav-height); }
header .header,
footer .footer { visibility: hidden; }
header .header[data-block-status="loaded"],
footer .footer[data-block-status="loaded"] { visibility: visible; }
h1, h2, h3, h4, h5, h6 {
  margin-top: 0.8em;
  margin-bottom: 0.25em;
  font-family: var(--heading-font-family);
  font-weight: 400;
  line-height: 1.25;
  scroll-margin: 40px;
}
h1 { font-size: var(--heading-font-size-xxl); }
h2 { font-size: var(--heading-font-size-xl); }
h3 { font-size: var(--heading-font-size-l); }
h4 { font-size: var(--heading-font-size-m); }
h5 { font-size: var(--heading-font-size-s); }
h6 { font-size: var(--heading-font-size-xs); }
p, dl, ol, ul, pre, blockquote {
  margin-top: 0.8em;
  margin-bottom: 0.25em;
}
code, pre { font-size: var(--body-font-size-s); }
pre {
  padding: 16px;
  border-radius: 8px;
  background-color: var(--light-color);
  overflow-x: auto;
  white-space: pre;
}
main > div { margin: 40px 16px; }
input, textarea, select, button { font: inherit; }
a:any-link {
  color: var(--link-color);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--accent-color);
  overflow-wrap: break-word;
}
a:hover {
  color: var(--link-hover-color);
  text-decoration-color: var(--link-hover-color);
}
p.button-wrapper { margin: 12px 0; }
a.button:any-link,
button.button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  margin: 0;
  border: 2px solid transparent;
  border-radius: 0;
  padding: 14px 35px;
  font-family: var(--body-font-family);
  font-size: var(--body-font-size-xs);
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
a.button[aria-disabled="true"],
button.button:disabled {
  cursor: not-allowed;
  pointer-events: none;
}
a.button.primary,
button.button.primary {
  border-color: var(--accent-color);
  background-color: var(--accent-color);
  color: var(--text-color);
}
a.button.primary:hover,
a.button.primary:focus-visible,
button.button.primary:hover,
button.button.primary:focus-visible {
  border-color: var(--accent-hover-color);
  background-color: var(--accent-hover-color);
  color: var(--text-color);
}
main img {
  max-width: 100%;
  width: auto;
  height: auto;
}
.icon {
  display: inline-block;
  height: 24px;
  width: 24px;
}
.icon img {
  height: 100%;
  width: 100%;
}
main > .section { margin: 40px 0; }
main > .section > div {
  max-width: 1200px;
  margin: auto;
  padding: 0 24px;
}
main > .section:first-of-type { margin-top: 0; }
@media (width >= 900px) {
  main > .section > div { padding: 0 32px; }
}
main .section.light,
main .section.highlight {
  background-color: var(--light-color);
  margin: 0;
  padding: 40px 0;
}
main .hero {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 60vh;
}
main .hero > picture {
  position: absolute;
  inset: 0;
  z-index: -2;
}
main .hero > picture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
main .hero > div {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 48px;
}
@media (width >= 900px) {
  main .hero { min-height: 72vh; }
  main .hero > div { bottom: 64px; }
}
</style>
